<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Proxy Settings</title>
  <style>
    body { padding: 20px; font-family: sans-serif; max-width: 300px; margin: auto; }
    label { display: block; margin-bottom: 5px; font-size: 14px; }
    input { width: 100%; padding: 8px; margin-bottom: 15px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #0056b3; }
    .status { margin-top: 15px; text-align: center; font-weight: bold; }
  </style>
</head>
<body>
  <h3>Settings SOCKS5</h3>
  <label>Host:</label>
  <input type="text" id="host">
  <label>Port:</label>
  <input type="number" id="port">
  <button id="save">Save</button>
  <div id="status" class="status"></div>
  <script src="options.js"></script>
</body>
</html>
